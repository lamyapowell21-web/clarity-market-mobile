name: Clarity evidence calibration

on:
  workflow_dispatch:
  schedule:
    # Runs before the U.S. market open on weekdays, including across DST changes.
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calibrate from recent historical market data
        run: python calibrate_engine.py

      - name: Save calibration back to repository
        run: |
          git config user.name "clarity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clarity_calibration.json
          if git diff --cached --quiet; then
            echo "No calibration change to commit."
          else
            git commit -m "Update Clarity evidence calibration"
            git push
          fi
